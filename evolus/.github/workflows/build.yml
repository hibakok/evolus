name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2

    - name: Restore dependencies
      run: nuget restore evolus.sln

    - name: Build
      run: msbuild evolus.sln /p:Configuration=Release /t:Build

    - name: Test
      run: dotnet test evolus.sln --no-build --verbosity normal
