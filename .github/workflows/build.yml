name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
    
    - name: Restore NuGet packages
      run: nuget restore evolus.sln
    
    - name: Build solution
      run: msbuild evolus.sln /p:Configuration=Release /t:Rebuild
    
    - name: Run tests
      run: vstest.console.exe evolus/tests/evolus.Tests/bin/Release/net48/evolus.Tests.dll --logger:console

