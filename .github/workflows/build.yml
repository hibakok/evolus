name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2
    
    - name: Restore dependencies
      run: dotnet restore evolus/evolus.sln
    
    - name: Build
      run: dotnet build evolus/evolus.sln --no-restore --configuration Release
    
    - name: Test
      run: dotnet test evolus/evolus.sln --no-build --configuration Release --verbosity normal

