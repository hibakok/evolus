name: .NET Framework Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET Framework
      uses: microsoft/setup-msbuild@v2
      
    - name: Restore NuGet packages
      run: dotnet restore evolus/evolus.sln
      
    - name: Build solution
      run: dotnet build evolus/evolus.sln --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test evolus/evolus.sln --configuration Release --no-build --verbosity normal
